<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tattoo Até os Ossos CRM</title>

<style>
  :root {
    --bg: #0f0f0f;
    --bg-panel: #0b0b0b;
    --bg-chat: #111111;
    --bg-card: #161616;
    --bg-card-hover: #1d1d1d;
    --border: #242424;
    --border-soft: #1c1c1c;
    --green: #00ff88;
    --green-dim: #0a3d24;
    --red: #ff5c5c;
    --red-dim: #2a0909;
    --yellow: #ffcc4d;
    --yellow-dim: #332600;
    --text: #f5f5f5;
    --text-dim: #999999;
    --text-faint: #666666;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  body { display: flex; flex-direction: column; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--green); border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- ESTADO DE CARREGAMENTO ---------- */
  .boot-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 13px;
  }

  /* ---------- HEADER ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 22px; border-bottom: 1px solid var(--border);
    background: #0c0c0c; flex-shrink: 0; height: 62px;
  }
  header h1 {
    font-size: 18px; margin: 0; display: flex; align-items: center; gap: 10px;
  }
  header h1 small { display: block; color: var(--text-faint); font-size: 10px; font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .status.ok::before { content: "●"; color: var(--green); }
  .status.bad::before { content: "●"; color: var(--red); }
  .logout-btn {
    padding: 8px 16px; border: 1px solid #333; border-radius: 10px;
    background: transparent; color: #fff; cursor: pointer; font-size: 13px;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  /* ---------- LAYOUT ---------- */
  .layout {
    display: none;
    grid-template-columns: 380px 1fr;
    height: calc(100vh - 62px);
    overflow: hidden;
  }

  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--bg-panel);
    display: flex; flex-direction: column;
    min-height: 0;
  }

  .top-metrics {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 14px 14px 10px;
    flex-shrink: 0;
  }
  .metric {
    background: var(--bg-card); border: 1px solid var(--border-soft);
    border-radius: 12px; padding: 10px 6px; text-align: center;
  }
  .metric strong { display: block; font-size: 19px; color: var(--green); }
  .metric span { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }

  .filters { padding: 0 14px 12px; display: grid; gap: 8px; flex-shrink: 0; }
  .filters input, .filters select {
    width: 100%; padding: 10px 12px; background: #141414; color: #fff;
    border: 1px solid #262626; border-radius: 10px; font-size: 13px; outline: none;
  }
  .filters input:focus, .filters select:focus { border-color: var(--green); }

  #leads { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 10px 14px; }

  .lead-card {
    background: var(--bg-card); border: 1px solid var(--border-soft);
    border-left: 3px solid #333; border-radius: 12px;
    padding: 12px 12px; margin-bottom: 8px; cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .lead-card:hover { background: var(--bg-card-hover); }
  .lead-card.active { background: #14241c; border-left-color: var(--green); }

  .lead-card.humano { border-left-color: var(--red); }
  .lead-card.quente { border-left-color: var(--yellow); }
  .lead-card.agendamento, .lead-card.orcamento { border-left-color: #4da3ff; }
  .lead-card.encerrado { border-left-color: #444; opacity: .6; }

  .lead-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .lead-name { font-weight: 600; font-size: 14px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lead-time { font-size: 10px; color: var(--text-faint); flex-shrink: 0; white-space: nowrap; }
  .lead-phone { font-size: 11px; color: var(--text-faint); margin-bottom: 6px; }

  .lead-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .badge {
    font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .02em; white-space: nowrap;
  }
  .badge-stage { background: #262626; color: #ccc; }
  .badge-stage.humano { background: var(--red-dim); color: var(--red); }
  .badge-stage.quente { background: var(--yellow-dim); color: var(--yellow); }
  .badge-stage.agendamento, .badge-stage.orcamento { background: #0a1f33; color: #4da3ff; }
  .badge-stage.novo, .badge-stage.captando_nome { background: #1c1c1c; color: #aaa; }
  .badge-stage.encerrado { background: #1a1a1a; color: #666; }

  .badge-owner { background: var(--green-dim); color: var(--green); }
  .badge-owner.human { background: var(--red-dim); color: var(--red); }

  .lead-message {
    font-size: 12px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* ---------- CHAT AREA ---------- */
  .chat-area { display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--bg-chat); }

  .chat-header {
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: #141414; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .chat-header-left { min-width: 0; }
  .chat-title { font-size: 19px; font-weight: 700; color: var(--green); margin-bottom: 3px; display:flex; align-items:center; gap:8px; }
  .chat-subtitle { color: var(--text-dim); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .chat-subtitle span { white-space: nowrap; }
  .chat-header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    background: #1c1c1c; border: 1px solid #2c2c2c; color: #ccc;
    border-radius: 10px; padding: 8px 10px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .icon-btn:hover { border-color: var(--green); color: var(--green); }
  .icon-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  .manual-note {
    display: none; padding: 10px 22px; background: var(--red-dim); color: #ff9d9d;
    border-bottom: 1px solid #4d1414; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }

  .chat-messages {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 24px; display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
    transition: padding .15s ease;
  }
  .chat-messages.expanded { padding: 36px 8%; }

  .day-divider {
    align-self: center; font-size: 11px; color: var(--text-faint);
    background: #1a1a1a; padding: 4px 12px; border-radius: 20px; margin: 6px 0;
  }

  .bubble {
    max-width: 72%; padding: 12px 15px; border-radius: 16px; font-size: 14.5px;
    line-height: 1.45; position: relative; word-wrap: break-word;
  }
  .bubble.user { align-self: flex-start; background: #1e1e1e; border-bottom-left-radius: 4px; }
  .bubble.assistant { align-self: flex-end; background: #0d3322; border-bottom-right-radius: 4px; color: #eafff2; }
  .bubble.assistant.manual { background: #17304a; color: #dcecff; }

  .bubble-meta {
    font-size: 10.5px; color: var(--text-faint); margin-bottom: 4px;
    display: flex; gap: 6px; align-items: center; text-transform: uppercase; letter-spacing: .03em;
  }
  .bubble.assistant .bubble-meta { color: #7fd9ad; justify-content: flex-end; }
  .role-dot { width: 6px; height: 6px; border-radius: 50%; background: #666; }
  .bubble.assistant .role-dot { background: var(--green); }

  .chat-image { max-width: 260px; border-radius: 12px; margin-top: 4px; cursor: zoom-in; display: block; }
  .chat-audio-msg { display: flex; align-items: center; gap: 8px; }
  .empty, .erro { margin: auto; color: var(--text-faint); font-size: 14px; text-align: center; }
  .erro { color: var(--red); }

  /* ---------- INPUT AREA ---------- */
  .chat-input-area {
    border-top: 1px solid var(--border); padding: 14px 18px;
    background: #101010; display: grid; gap: 10px; flex-shrink: 0;
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .chat-input-area textarea {
    flex: 1; min-height: 52px; max-height: 140px; resize: vertical;
    border: 1px solid #2c2c2c; border-radius: 14px; background: #1a1a1a; color: #fff;
    padding: 13px 14px; font-size: 14.5px; outline: none; font-family: inherit;
  }
  .chat-input-area textarea:focus { border-color: var(--green); }
  .mic-btn {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%;
    background: #1c1c1c; border: 1px solid #2c2c2c; color: #ccc; cursor: pointer;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .mic-btn:hover { border-color: var(--green); color: var(--green); }
  .mic-btn.recording { background: var(--red-dim); border-color: var(--red); color: var(--red); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,92,92,.5);} 50%{box-shadow:0 0 0 8px rgba(255,92,92,0);} }

  .rec-indicator {
    display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--red);
    padding: 2px 4px;
  }
  .rec-indicator.show { display: flex; }
  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1s infinite; }

  .chat-buttons { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
  .chat-buttons button {
    padding: 12px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;
    font-size: 13.5px;
  }
  .btn-send { background: var(--green); color: #000; }
  .btn-send:hover { filter: brightness(1.08); }
  .btn-human { background: var(--red-dim); color: var(--red); border: 1px solid #4d1414 !important; }
  .btn-human:hover { background: var(--red); color: #fff; }
  .btn-ai { background: #17304a; color: #7fc4ff; border: 1px solid #1c3d5c !important; }
  .btn-ai:hover { background: #1c3d5c; }
  button:disabled { opacity: .5; cursor: default; }

  /* ---------- IMAGE VIEWER ---------- */
  .image-viewer {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 50;
    align-items: center; justify-content: center; flex-direction: column;
  }
  .image-viewer.show { display: flex; }
  .image-viewer-toolbar { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; }
  .image-viewer-toolbar button {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid #333;
    background: #1a1a1a; color: #fff; cursor: pointer; font-size: 16px;
  }
  .image-viewer-content { max-width: 90vw; max-height: 90vh; overflow: auto; }
  .image-viewer-content img { max-width: none; transition: transform .1s ease; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>

<body>

<div id="bootWrap" class="boot-wrap">Carregando…</div>

<header>
  <h1>
    💀 Tattoo Até os Ossos CRM
    <small>Powered by Osso Digital</small>
  </h1>
  <div class="header-right">
    <div id="status" class="status"></div>
    <button id="logoutBtn" class="logout-btn" onclick="logout()" style="display:none;">Sair</button>
  </div>
</header>

<div id="app" class="layout">

  <aside class="sidebar">
    <div class="top-metrics">
      <div class="metric"><strong id="mTotal">0</strong><span>Total</span></div>
      <div class="metric"><strong id="mHumano">0</strong><span>Humano</span></div>
      <div class="metric"><strong id="mQuente">0</strong><span>Quente</span></div>
      <div class="metric"><strong id="mAgenda">0</strong><span>Agenda</span></div>
    </div>

    <div class="filters">
      <input id="busca" type="text" placeholder="Buscar nome, telefone ou mensagem...">
      <select id="filtroStage">
        <option value="">Todos os stages</option>
        <option value="humano">Humano</option>
        <option value="quente">Quente</option>
        <option value="agendamento">Agendamento</option>
        <option value="orcamento">Orçamento</option>
        <option value="novo">Novo</option>
        <option value="captando_nome">Captando nome</option>
        <option value="encerrado">Encerrado</option>
        <option value="followup_1">Followup 1</option>
        <option value="followup_2">Followup 2</option>
        <option value="curioso">Curioso</option>
      </select>
    </div>

    <div id="leads"></div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">
      <div class="chat-header-left">
        <div id="chatTitle" class="chat-title">Selecione um lead</div>
        <div id="chatSubtitle" class="chat-subtitle">Clique em um contato para acompanhar a conversa completa.</div>
      </div>
      <div class="chat-header-actions">
        <button id="btnExpand" class="icon-btn" onclick="toggleExpand()" title="Expandir conversa">⤢ Expandir</button>
      </div>
    </div>

    <div id="manualNote" class="manual-note">🚨 ATENDIMENTO HUMANO ATIVO — IA BLOQUEADA PARA ESTE LEAD</div>

    <div id="chatMessages" class="chat-messages">
      <div class="empty">Nenhum lead selecionado.</div>
    </div>

    <div class="chat-input-area">
      <div id="recIndicator" class="rec-indicator">
        <span class="rec-dot"></span>
        <span id="recTime">Gravando... 0:00</span>
      </div>
      <div class="input-row">
        <textarea id="msgInput" placeholder="Digite uma mensagem manual para o lead..."></textarea>
        <button id="btnMic" class="mic-btn" onclick="alternarGravacao()" title="Gravar áudio / ditar por voz">🎤</button>
      </div>
      <div class="chat-buttons">
        <button id="btnSend" class="btn-send" onclick="enviarMensagemManual()">📤 Enviar mensagem</button>
        <button id="btnHuman" class="btn-human" onclick="ativarHumano()">🔴 Takeover</button>
        <button id="btnAI" class="btn-ai" onclick="voltarIA()">🤖 Voltar IA</button>
      </div>
    </div>
  </main>

</div>

<div id="imageViewer" class="image-viewer" role="dialog" aria-modal="true" aria-label="Visualização da imagem">
  <div class="image-viewer-toolbar">
    <button type="button" onclick="alterarZoomImagem(-0.25)" aria-label="Diminuir zoom">−</button>
    <button type="button" onclick="resetarZoomImagem()" aria-label="Restaurar zoom">1:1</button>
    <button type="button" onclick="alterarZoomImagem(0.25)" aria-label="Aumentar zoom">+</button>
    <button type="button" onclick="fecharImagem()" aria-label="Fechar imagem">×</button>
  </div>
  <div class="image-viewer-content" onclick="fecharImagemAoClicarFora(event)">
    <img id="imageViewerImg" alt="Imagem ampliada da conversa">
  </div>
</div>

<script src="/auth/supabase-auth.js"></script>
<script>
const API = "/api/dashboard";

const bootWrap = document.getElementById("bootWrap");
const statusBox = document.getElementById("status");
const app = document.getElementById("app");
const logoutBtn = document.getElementById("logoutBtn");
const leadsBox = document.getElementById("leads");
const buscaInput = document.getElementById("busca");
const filtroStage = document.getElementById("filtroStage");
const chatTitle = document.getElementById("chatTitle");
const chatSubtitle = document.getElementById("chatSubtitle");
const chatMessages = document.getElementById("chatMessages");
const manualNote = document.getElementById("manualNote");
const msgInput = document.getElementById("msgInput");
const btnSend = document.getElementById("btnSend");
const btnHuman = document.getElementById("btnHuman");
const btnAI = document.getElementById("btnAI");
const btnMic = document.getElementById("btnMic");
const btnExpand = document.getElementById("btnExpand");
const recIndicator = document.getElementById("recIndicator");
const recTime = document.getElementById("recTime");
const imageViewer = document.getElementById("imageViewer");
const imageViewerImg = document.getElementById("imageViewerImg");

let leadsCache = [];
let selectedPhone = null;
let lastMessageCount = 0;
let zoomAtual = 1;
let expanded = false;
let pollTimer = null;

function escaparHTML(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function formatarData(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function formatarHora(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function tempoRelativo(iso) {
  if (!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `${min}min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `${h}h`;
  const dias = Math.floor(h / 24);
  return `${dias}d`;
}

function ownershipPresentation(lead) {
  const isHuman = lead.conversation_owner === "HUMAN" || lead.stage === "humano";
  return isHuman
    ? { label: "🧑 Atendimento humano", css: "human" }
    : { label: "🤖 IA ativa", css: "" };
}

function mostrarApp() {
  bootWrap.style.display = "none";
  app.style.display = "grid";
  logoutBtn.style.display = "inline-block";
}

async function logout() {
  await window.ossoAuth.signOut();
}

// ---------- LEADS ----------

function filtrarLeads() {
  const termo = (buscaInput.value || "").toLowerCase().trim();
  const stage = filtroStage.value;
  return leadsCache
    .slice()
    .sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0))
    .filter(lead => {
      const texto = `${lead.name || ""} ${lead.phone || ""} ${lead.last_message || ""}`.toLowerCase();
      const matchBusca = !termo || texto.includes(termo);
      const matchStage = !stage || lead.stage === stage;
      return matchBusca && matchStage;
    });
}

function renderLeads() {
  const leads = filtrarLeads();
  leadsBox.innerHTML = "";

  if (!leads.length) {
    leadsBox.innerHTML = `<div class="empty" style="margin-top:30px;">Nenhum lead encontrado.</div>`;
    return;
  }

  leads.forEach(lead => {
    const ativo = selectedPhone === lead.phone ? "active" : "";
    const stage = lead.stage || "novo";
    const ownership = ownershipPresentation(lead);

    leadsBox.innerHTML += `
      <div class="lead-card ${escaparHTML(stage)} ${ativo}" onclick="selecionarLead('${escaparHTML(lead.phone)}')">
        <div class="lead-top-row">
          <div class="lead-name">👤 ${escaparHTML(lead.name || "Sem nome")}</div>
          <div class="lead-time">${escaparHTML(tempoRelativo(lead.updated_at))}</div>
        </div>
        <div class="lead-phone">📱 ${escaparHTML(lead.phone)}</div>
        <div class="lead-badges">
          <span class="badge badge-stage ${escaparHTML(stage)}">${escaparHTML(stage)}</span>
          <span class="badge badge-owner ${escaparHTML(ownership.css)}">${escaparHTML(ownership.label)}</span>
        </div>
        <div class="lead-message">💬 ${escaparHTML(lead.last_message || "")}</div>
      </div>
    `;
  });
}

async function carregarLeads() {
  const res = await window.ossoAuth.authorizedFetch(API + "?debug=leads");
  const data = await res.json();

  if (!res.ok || !data.ok) {
    statusBox.className = "status bad";
    statusBox.textContent = "Sessão inválida";
    location.replace("/login");
    return;
  }

  mostrarApp();
  leadsCache = data.data || [];
  atualizarMetricas(leadsCache);
  renderLeads();
  statusBox.className = "status ok";
  statusBox.textContent = "Dashboard conectado";

  if (selectedPhone) {
    const leadAtual = leadsCache.find(l => l.phone === selectedPhone);
    if (leadAtual) atualizarHeaderLead(leadAtual);
  }
}

function atualizarMetricas(leads) {
  document.getElementById("mTotal").textContent = leads.length;
  document.getElementById("mHumano").textContent = leads.filter(l => l.stage === "humano").length;
  document.getElementById("mQuente").textContent = leads.filter(l => l.stage === "quente").length;
  document.getElementById("mAgenda").textContent = leads.filter(l => l.stage === "agendamento").length;
}

function atualizarHeaderLead(lead) {
  const ownership = ownershipPresentation(lead);
  chatTitle.innerHTML = `${escaparHTML(lead.name || "Sem nome")} <span style="color:#666;font-weight:400;font-size:14px;">— ${escaparHTML(lead.phone)}</span>`;

  const partes = [
    `🎯 ${escaparHTML(lead.stage || "novo")}`,
    `${escaparHTML(ownership.label)}`
  ];
  if (lead.created_at) partes.push(`📅 Cliente desde ${escaparHTML(formatarData(lead.created_at))}`);
  if (lead.updated_at) partes.push(`🕓 Última msg ${escaparHTML(formatarData(lead.updated_at))}`);

  chatSubtitle.innerHTML = partes.map(p => `<span>${p}</span>`).join("");

  manualNote.style.display = (lead.conversation_owner === "HUMAN" || lead.stage === "humano") ? "block" : "none";
}

async function selecionarLead(phone) {
  selectedPhone = phone;
  lastMessageCount = 0;

  const lead = leadsCache.find(l => l.phone === phone);
  if (lead) atualizarHeaderLead(lead);

  renderLeads();
  await carregarConversa(phone, true);
}

// ---------- CONVERSA ----------

function agruparPorDia(mensagens) {
  const grupos = [];
  let diaAtual = null;
  mensagens.forEach(msg => {
    const dia = msg.created_at ? new Date(msg.created_at).toLocaleDateString("pt-BR") : "";
    if (dia !== diaAtual) {
      grupos.push({ tipo: "divider", dia });
      diaAtual = dia;
    }
    grupos.push({ tipo: "msg", msg });
  });
  return grupos;
}

async function carregarConversa(phone, forceScroll = false) {
  const url = API + "?debug=messages-by-phone&phone=" + encodeURIComponent(phone);
  const res = await window.ossoAuth.authorizedFetch(url);
  const data = await res.json();

  if (!res.ok || !data.ok) {
    chatMessages.innerHTML = `<div class="erro">Erro ao carregar conversa.</div>`;
    return;
  }

  const mensagens = data.data || [];

  if (!mensagens.length) {
    chatMessages.innerHTML = `<div class="empty">Sem mensagens para este lead.</div>`;
    lastMessageCount = 0;
    return;
  }

  const deveScrollar = forceScroll || mensagens.length !== lastMessageCount;
  lastMessageCount = mensagens.length;

  const grupos = agruparPorDia(mensagens);
  let html = "";

  grupos.forEach(item => {
    if (item.tipo === "divider") {
      html += `<div class="day-divider">${escaparHTML(item.dia)}</div>`;
      return;
    }

    const msg = item.msg;
    const roleClass = msg.role === "user" ? "user" : "assistant";
    const manual = msg.role === "assistant" && msg.manual ? "manual" : "";
    const roleLabel = msg.role === "user" ? "Cliente" : (msg.manual ? "Você" : "Agente IA");

    let conteudoHTML = escaparHTML(msg.content);
    if (msg.media_type === "image") {
      conteudoHTML = `<img class="chat-image" src="${escaparHTML(msg.media_url)}" alt="Imagem enviada na conversa" onclick="abrirImagem('${escaparHTML(msg.media_url)}')">`;
    } else if (msg.media_type === "audio") {
      conteudoHTML = `<div class="chat-audio-msg">🎤 <span>${escaparHTML(msg.content)}</span></div>`;
    }

    html += `
      <div class="bubble ${roleClass} ${manual}">
        <div class="bubble-meta"><span class="role-dot"></span>${escaparHTML(roleLabel)} • ${escaparHTML(formatarHora(msg.created_at))}</div>
        ${conteudoHTML}
      </div>
    `;
  });

  chatMessages.innerHTML = html;

  if (deveScrollar) {
    setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 50);
  }
}

function toggleExpand() {
  expanded = !expanded;
  chatMessages.classList.toggle("expanded", expanded);
  btnExpand.classList.toggle("active", expanded);
  btnExpand.textContent = expanded ? "⤡ Recolher" : "⤢ Expandir";
}

// ---------- ENVIO DE MENSAGEM ----------

async function enviarMensagemManual() {
  if (!selectedPhone) { alert("Selecione um lead primeiro."); return; }
  const mensagem = msgInput.value.trim();
  if (!mensagem) { alert("Digite uma mensagem."); return; }

  btnSend.disabled = true;
  btnSend.textContent = "Enviando...";

  try {
    const res = await window.ossoAuth.authorizedFetch(API + "?debug=send-message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: selectedPhone, message: mensagem })
    });
    const data = await res.json();

    if (!res.ok || !data.ok) {
      alert("Erro ao enviar mensagem.");
      console.error(data);
      return;
    }

    msgInput.value = "";
    await carregarLeads();
    await carregarConversa(selectedPhone, true);
  } catch (err) {
    console.error(err);
    alert("Erro ao enviar mensagem.");
  } finally {
    btnSend.disabled = false;
    btnSend.textContent = "📤 Enviar mensagem";
  }
}

async function ativarHumano() {
  if (!selectedPhone) { alert("Selecione um lead primeiro."); return; }
  btnHuman.disabled = true;
  btnHuman.textContent = "Assumindo...";
  try {
    const res = await window.ossoAuth.authorizedFetch(API + "?debug=takeover", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: selectedPhone })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) { alert("Erro ao assumir atendimento."); console.error(data); return; }
    await carregarLeads();
    await carregarConversa(selectedPhone, true);
  } catch (err) {
    console.error(err);
    alert("Erro ao assumir atendimento.");
  } finally {
    btnHuman.disabled = false;
    btnHuman.textContent = "🔴 Takeover";
  }
}

async function voltarIA() {
  if (!selectedPhone) { alert("Selecione um lead primeiro."); return; }
  if (!confirm("Tem certeza que deseja liberar a IA novamente para este lead?")) return;
  btnAI.disabled = true;
  btnAI.textContent = "Liberando...";
  try {
    const res = await window.ossoAuth.authorizedFetch(API + "?debug=release-ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: selectedPhone })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) { alert("Erro ao liberar IA."); console.error(data); return; }
    await carregarLeads();
    await carregarConversa(selectedPhone, true);
  } catch (err) {
    console.error(err);
    alert("Erro ao liberar IA.");
  } finally {
    btnAI.disabled = false;
    btnAI.textContent = "🤖 Voltar IA";
  }
}

// ---------- VOZ: ditar por texto OU gravar áudio ----------
// Clique curto = ditado por voz (Web Speech API) direto na caixa de texto.
// Clique e segure (>600ms) = grava áudio de verdade pra enviar como mensagem de voz.
// (Envio de áudio de verdade depende de uma extensão no backend ainda pendente —
// por enquanto o botão sempre dita por texto; ver observação no chat.)

let recognizer = null;
let isDictating = false;

function iniciarDitado() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Seu navegador não suporta ditado por voz. Use o Chrome no computador.");
    return;
  }
  recognizer = new SpeechRecognition();
  recognizer.lang = "pt-BR";
  recognizer.continuous = true;
  recognizer.interimResults = true;

  let baseTexto = msgInput.value ? msgInput.value + " " : "";
  let segundos = 0;
  const timer = setInterval(() => {
    segundos++;
    const m = Math.floor(segundos / 60);
    const s = String(segundos % 60).padStart(2, "0");
    recTime.textContent = `Ditando... ${m}:${s}`;
  }, 1000);

  recognizer.onresult = (event) => {
    let texto = "";
    for (let i = 0; i < event.results.length; i++) {
      texto += event.results[i][0].transcript;
    }
    msgInput.value = baseTexto + texto;
  };

  recognizer.onerror = () => pararDitado(timer);
  recognizer.onend = () => pararDitado(timer);

  recognizer.start();
  isDictating = true;
  btnMic.classList.add("recording");
  recIndicator.classList.add("show");
}

function pararDitado(timer) {
  if (timer) clearInterval(timer);
  isDictating = false;
  btnMic.classList.remove("recording");
  recIndicator.classList.remove("show");
  if (recognizer) { try { recognizer.stop(); } catch (e) {} }
}

function alternarGravacao() {
  if (isDictating) {
    pararDitado();
  } else {
    iniciarDitado();
  }
}

// ---------- VISUALIZADOR DE IMAGEM ----------

function abrirImagem(url) {
  imageViewerImg.src = url;
  zoomAtual = 1;
  imageViewerImg.style.transform = "scale(1)";
  imageViewer.classList.add("show");
}

function fecharImagem() {
  imageViewer.classList.remove("show");
  imageViewerImg.src = "";
}

function fecharImagemAoClicarFora(event) {
  if (event.target === event.currentTarget) fecharImagem();
}

function alterarZoomImagem(delta) {
  zoomAtual = Math.min(4, Math.max(0.5, zoomAtual + delta));
  imageViewerImg.style.transform = `scale(${zoomAtual})`;
}

function resetarZoomImagem() {
  zoomAtual = 1;
  imageViewerImg.style.transform = "scale(1)";
}

// ---------- EVENTOS ----------

buscaInput.addEventListener("input", renderLeads);
filtroStage.addEventListener("change", renderLeads);

msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    enviarMensagemManual();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") fecharImagem();
});

// ---------- BOOT ----------

window.ossoAuth.getSession().then(session => {
  if (!session) {
    location.replace("/login");
    return;
  }
  carregarLeads();
  pollTimer = setInterval(() => {
    carregarLeads();
    if (selectedPhone) carregarConversa(selectedPhone, false);
  }, 6000);
});
