<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tattoo Até os Ossos CRM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      padding: 18px 24px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #101010;
      flex-shrink: 0;
    }

    h1 {
      color: #00ff88;
      font-size: 24px;
      margin: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status {
      color: #aaa;
      font-size: 14px;
    }

    .logout-btn {
      background: #1f1f1f;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #2a2a2a;
    }

    .login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #161616;
      border: 1px solid #2b2b2b;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }

    .login-card h2 {
      margin-top: 0;
      color: #00ff88;
      margin-bottom: 10px;
    }

    .login-card p {
      color: #aaa;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    .login-card input {
      width: 100%;
      padding: 14px;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 12px;
      margin-bottom: 14px;
      outline: none;
      font-size: 15px;
    }

    .login-card button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #00ff88;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .layout {
      display: none;
      grid-template-columns: 360px 1fr;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .sidebar {
      border-right: 1px solid #222;
      background: #0b0b0b;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 15px;
    }

    .chat-area {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: #111;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #222;
      background: #151515;
      flex-shrink: 0;
    }

    .chat-title {
      font-size: 22px;
      font-weight: bold;
      color: #00ff88;
      margin-bottom: 6px;
    }

    .chat-subtitle {
      color: #aaa;
      font-size: 14px;
    }

    .manual-note {
      display: none;
      padding: 12px 20px;
      background: #2a0909;
      color: #ff9d9d;
      border-top: 1px solid #4d1414;
      border-bottom: 1px solid #4d1414;
      font-weight: bold;
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar,
    .sidebar::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-thumb,
    .sidebar::-webkit-scrollbar-thumb {
      background: #00ff88;
      border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-track,
    .sidebar::-webkit-scrollbar-track {
      background: #111;
    }

    .chat-input-area {
      border-top: 1px solid #222;
      padding: 14px;
      background: #101010;
      display: grid;
      gap: 10px;
      flex-shrink: 0;
    }

    .chat-input-area textarea {
      width: 100%;
      height: 80px;
      resize: none;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1a1a1a;
      color: #fff;
      padding: 14px;
      font-size: 15px;
      outline: none;
    }

    .chat-buttons {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
    }

    .chat-buttons button {
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .chat-buttons button:hover {
      opacity: .88;
    }

    .btn-send {
      background: #00ff88;
      color: #000;
    }

    .btn-human {
      background: #ff3b3b;
      color: #fff;
    }

    .btn-ai {
      background: #00bfff;
      color: #000;
    }

    .filters {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      background: #1b1b1b;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
    }

    .lead-card {
      background: #1a1a1a;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border-left: 4px solid #00ff88;
      cursor: pointer;
      transition: .15s;
    }

    .lead-card:hover {
      background: #222;
      transform: translateY(-1px);
    }

    .lead-card.active {
      outline: 2px solid #00ff88;
      background: #17241d;
    }

    .lead-card.humano {
      border-left-color: #ff3b3b;
      background: #241414;
    }

    .lead-card.quente {
      border-left-color: #ffb000;
    }

    .lead-card.agendamento {
      border-left-color: #00bfff;
    }

    .lead-card.orcamento {
      border-left-color: #b366ff;
    }

    .lead-phone {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .lead-name {
      color: #ddd;
      margin-bottom: 6px;
    }

    .lead-stage {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #333;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .lead-stage.humano {
      background: #5a1111;
      color: #ff8888;
    }

    .lead-stage.quente {
      background: #4a3200;
      color: #ffd36b;
    }

    .lead-stage.agendamento {
      background: #00384a;
      color: #77dfff;
    }

    .lead-stage.orcamento {
      background: #35164d;
      color: #d8a4ff;
    }

    .lead-ownership {
      display: inline-block;
      margin-left: 6px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #24313a;
      color: #b8d8e8;
      font-size: 12px;
    }

    .lead-ownership.ai-hold { background: #4a3200; color: #ffd36b; }
    .lead-ownership.human { background: #5a1111; color: #ff8888; }
    .lead-ownership.ai { background: #123d2b; color: #83efb6; }

    .lead-message {
      color: #aaa;
      font-size: 13px;
      line-height: 1.35;
    }

    .bubble {
      max-width: 70%;
      padding: 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
    }

    .bubble.user {
      align-self: flex-end;
      background: #075e54;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #1f1f1f;
      color: #00ff88;
      border-bottom-left-radius: 4px;
    }

    .bubble-meta {
      font-size: 11px;
      opacity: .65;
      margin-bottom: 5px;
    }

    .chat-image {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      cursor: zoom-in;
    }

    .image-viewer {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      flex-direction: column;
      background: rgba(0, 0, 0, .96);
    }

    .image-viewer.open {
      display: flex;
    }

    .image-viewer-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px;
      flex-shrink: 0;
    }

    .image-viewer-toolbar button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1f1f1f;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .image-viewer-content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      touch-action: pinch-zoom;
    }

    .image-viewer-content img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
      transition: transform .15s ease;
      touch-action: pinch-zoom;
    }

    .top-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric {
      background: #171717;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #222;
    }

    .metric strong {
      display: block;
      color: #00ff88;
      font-size: 20px;
    }

    .metric span {
      color: #aaa;
      font-size: 11px;
    }

    .empty {
      color: #777;
      text-align: center;
      margin-top: 80px;
      font-size: 18px;
    }

    .back-to-leads {
      display: none;
    }

    .view-tabs {
      display: none;
      height: 56px;
      align-items: center;
      gap: 8px;
      padding: 0 24px;
      background: #101010;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .view-tab {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #aaa;
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      font-family: inherit;
    }

    .view-tab:hover {
      background: #1a1a1a;
      color: #fff;
    }

    .view-tab.active {
      background: #00ff88;
      color: #000;
      border-color: #00ff88;
    }

    .reports-view {
      display: none;
      height: calc(100vh - 70px - 56px);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 22px 24px 40px;
      box-sizing: border-box;
    }

    .reports-view.open {
      display: block;
    }

    .reports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .report-card {
      background: #171717;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 18px;
    }

    .report-card strong {
      display: block;
      color: #00ff88;
      font-size: 28px;
      margin-bottom: 4px;
    }

    .report-card span {
      color: #aaa;
      font-size: 13px;
    }

    .report-panel {
      background: #171717;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .report-panel h3 {
      margin: 0 0 16px;
      color: #fff;
      font-size: 15px;
    }

    .stage-row {
      display: grid;
      grid-template-columns: 130px 1fr 40px;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #ddd;
    }

    .stage-row .stage-track {
      background: #111;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }

    .stage-row .stage-fill {
      height: 100%;
      border-radius: 999px;
      background: #00ff88;
    }

    .reports-empty {
      color: #777;
      text-align: center;
      margin-top: 60px;
    }

    .reports-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .period-tabs {
      display: flex;
      gap: 6px;
    }

    .period-tab {
      background: #171717;
      border: 1px solid #2a2a2a;
      color: #aaa;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      font-family: inherit;
    }

    .period-tab:hover {
      background: #1e1e1e;
      color: #fff;
    }

    .period-tab.active {
      background: #00ff88;
      color: #000;
      border-color: #00ff88;
    }

    .export-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #eee;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      font-family: inherit;
    }

    .export-btn:hover {
      background: #242424;
    }

    .reports-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .funnel-row {
      display: grid;
      grid-template-columns: 100px 1fr 42px;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #ddd;
    }

    .funnel-track {
      background: #111;
      border-radius: 8px;
      height: 24px;
      overflow: hidden;
    }

    .funnel-fill {
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, #00ff88, #00bfff);
      min-width: 4px;
    }

    .reengajamento-note {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .hot-lead-card {
      background: #171717;
      border: 1px solid #222;
      border-left: 4px solid #00ff88;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .hot-lead-card:hover {
      background: #1e1e1e;
    }

    .hot-lead-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .hot-lead-name {
      font-weight: bold;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hot-lead-message {
      color: #999;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .owner-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .owner-card {
      background: #111;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .owner-card strong {
      display: block;
      font-size: 26px;
      margin-bottom: 4px;
    }

    .owner-card.ia strong {
      color: #00bfff;
    }

    .owner-card.humano strong {
      color: #ff3b3b;
    }

    .owner-card span {
      color: #aaa;
      font-size: 12px;
      display: block;
    }

    .owner-card .owner-rate {
      margin-top: 8px;
      font-size: 13px;
      color: #ddd;
    }

    @media (max-width: 1100px) {
      .reports-columns {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }

      .sidebar {
        height: 100%;
        min-height: 0;
        border-right: 0;
        border-bottom: 0;
      }

      .chat-area {
        display: none;
        height: 100%;
        min-height: 0;
      }

      .layout.chat-open .sidebar {
        display: none;
      }

      .layout.chat-open .chat-area {
        display: flex;
      }

      .back-to-leads {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #1a1a1a;
        color: #eee;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 8px;
        font-size: 14px;
        min-height: 40px;
        cursor: pointer;
      }

      .chat-buttons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chat-buttons .btn-send {
        grid-column: 1 / -1;
      }

      .chat-buttons button {
        min-height: 44px;
        padding: 11px 8px;
      }

      .bubble {
        max-width: 92%;
      }

      .chat-input-area {
        padding: 10px;
        gap: 8px;
      }

      .chat-input-area textarea {
        height: 58px;
      }

      h1 {
        font-size: 18px;
      }

      .view-tabs {
        padding: 0 14px;
        gap: 6px;
      }

      .view-tab {
        padding: 8px 12px;
        font-size: 13px;
      }

      .reports-view {
        padding: 14px;
      }

      .reports-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .owner-compare {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>
    💀 Tattoo Até os Ossos CRM
    <small style="display:block; margin-top:4px; color:#888; font-size:11px; font-weight:normal;">
      Powered by Osso Digital
    </small>
  </h1>

  <div class="header-right">
    <div id="status" class="status"></div>

    <button
      id="logoutBtn"
      class="logout-btn"
      onclick="logout()"
      style="display:none;"
    >
      Sair
    </button>
  </div>
</header>

<div id="viewTabs" class="view-tabs">
  <button type="button" class="view-tab active" data-view="conversas" onclick="alternarView('conversas')">
    💬 Conversas
  </button>
  <button type="button" class="view-tab" data-view="relatorios" onclick="alternarView('relatorios')">
    📊 Relatórios
  </button>
</div>

<div id="app" class="layout">

  <aside class="sidebar">

    <div class="top-metrics">

      <div class="metric">
        <strong id="mTotal">0</strong>
        <span>Total</span>
      </div>

      <div class="metric">
        <strong id="mHumano">0</strong>
        <span>Humano</span>
      </div>

      <div class="metric">
        <strong id="mQuente">0</strong>
        <span>Quente</span>
      </div>

      <div class="metric">
        <strong id="mAgenda">0</strong>
        <span>Agenda</span>
      </div>

    </div>

    <div class="filters">

      <input
        id="busca"
        type="text"
        placeholder="Buscar nome, telefone ou mensagem..."
      >

      <select id="filtroStage">
        <option value="">Todos os stages</option>
        <option value="humano">Humano</option>
        <option value="quente">Quente</option>
        <option value="agendamento">Agendamento</option>
        <option value="orcamento">Orçamento</option>
        <option value="novo">Novo</option>
        <option value="captando_nome">Captando nome</option>
        <option value="encerrado">Encerrado</option>
        <option value="followup_1">Followup 1</option>
        <option value="followup_2">Followup 2</option>
        <option value="curioso">Curioso</option>
      </select>

    </div>

    <div id="leads"></div>

  </aside>

  <main class="chat-area">

    <div class="chat-header">

      <button type="button" class="back-to-leads" onclick="voltarParaListaMobile()">
        ← Leads
      </button>

      <div id="chatTitle" class="chat-title">
        Selecione um lead
      </div>

      <div id="chatSubtitle" class="chat-subtitle">
        Clique em um contato para acompanhar a conversa completa.
      </div>

    </div>

    <div id="manualNote" class="manual-note">
      🚨 ATENDIMENTO HUMANO ATIVO — IA BLOQUEADA PARA ESTE LEAD
    </div>

    <div id="chatMessages" class="chat-messages">

      <div class="empty">
        Nenhum lead selecionado.
      </div>

    </div>

    <div class="chat-input-area">

      <textarea
        id="msgInput"
        placeholder="Digite uma mensagem manual para o lead..."
      ></textarea>

      <div class="chat-buttons">

        <button
          id="btnSend"
          class="btn-send"
          onclick="enviarMensagemManual()"
        >
          📤 Enviar mensagem
        </button>

        <button
          id="btnHuman"
          class="btn-human"
          onclick="ativarHumano()"
        >
          🔴 Takeover
        </button>

        <button
          id="btnAI"
          class="btn-ai"
          onclick="voltarIA()"
        >
          🤖 Voltar IA
        </button>

      </div>

    </div>

  </main>

</div>

<div id="reportsView" class="reports-view">

  <div class="reports-toolbar">
    <div class="period-tabs">
      <button type="button" class="period-tab" data-dias="7" onclick="mudarPeriodoRelatorio(7)">7 dias</button>
      <button type="button" class="period-tab active" data-dias="30" onclick="mudarPeriodoRelatorio(30)">30 dias</button>
      <button type="button" class="period-tab" data-dias="90" onclick="mudarPeriodoRelatorio(90)">90 dias</button>
    </div>
    <button type="button" class="export-btn" onclick="exportarLeadsCSV()">⬇ Exportar CSV</button>
  </div>

  <div id="reportsContent">
    <div class="reports-empty">Carregando relatórios...</div>
  </div>
</div>

<div
  id="imageViewer"
  class="image-viewer"
  role="dialog"
  aria-modal="true"
  aria-label="Visualização da imagem"
>
  <div class="image-viewer-toolbar">
    <button type="button" onclick="alterarZoomImagem(-0.25)" aria-label="Diminuir zoom">−</button>
    <button type="button" onclick="resetarZoomImagem()" aria-label="Restaurar zoom">1:1</button>
    <button type="button" onclick="alterarZoomImagem(0.25)" aria-label="Aumentar zoom">+</button>
    <button type="button" onclick="fecharImagem()" aria-label="Fechar imagem">×</button>
  </div>

  <div class="image-viewer-content" onclick="fecharImagemAoClicarFora(event)">
    <img id="imageViewerImg" alt="Imagem ampliada da conversa">
  </div>
</div>

<script src="/auth/supabase-auth.js"></script>
<script>

const API =
  "/api/dashboard";

const statusBox =
  document.getElementById("status");

const app =
  document.getElementById("app");

const logoutBtn =
  document.getElementById("logoutBtn");

const leadsBox =
  document.getElementById("leads");

const chatTitle =
  document.getElementById("chatTitle");

const chatSubtitle =
  document.getElementById("chatSubtitle");

const chatMessages =
  document.getElementById("chatMessages");

const manualNote =
  document.getElementById("manualNote");

const busca =
  document.getElementById("busca");

const filtroStage =
  document.getElementById("filtroStage");

const msgInput =
  document.getElementById("msgInput");

const btnSend =
  document.getElementById("btnSend");

const btnHuman =
  document.getElementById("btnHuman");

const btnAI =
  document.getElementById("btnAI");

const imageViewer =
  document.getElementById("imageViewer");

const imageViewerImg =
  document.getElementById("imageViewerImg");

const viewTabs =
  document.getElementById("viewTabs");

const reportsView =
  document.getElementById("reportsView");

const reportsContent =
  document.getElementById("reportsContent");

let leadsCache = [];
let reportsIntervalo = null;
let relatoriosPeriodoAtual = 30;
let relatoriosUltimoResultado = null;
let selectedPhone = null;
let lastMessageCount = 0;
let intervalo = null;
let imageZoom = 1;

function aplicarZoomImagem() {
  imageViewerImg.style.transform =
    `scale(${imageZoom})`;
}

function abrirImagem(src) {
  imageViewerImg.src = src;
  imageZoom = 1;
  aplicarZoomImagem();
  imageViewer.classList.add("open");
  document.body.style.overflow = "hidden";
}

function fecharImagem() {
  imageViewer.classList.remove("open");
  imageViewerImg.removeAttribute("src");
  imageZoom = 1;
  document.body.style.overflow = "";
}

function alterarZoomImagem(delta) {
  imageZoom = Math.min(4, Math.max(0.5, imageZoom + delta));
  aplicarZoomImagem();
}

function resetarZoomImagem() {
  imageZoom = 1;
  aplicarZoomImagem();
}

function fecharImagemAoClicarFora(event) {
  if (event.target === event.currentTarget) {
    fecharImagem();
  }
}

chatMessages.addEventListener("click", function(event) {
  const image = event.target.closest(".chat-image");
  if (image) {
    abrirImagem(image.currentSrc || image.src);
  }
});

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape" && imageViewer.classList.contains("open")) {
    fecharImagem();
  }
});

function mostrarApp() {
  app.style.display = "grid";
  logoutBtn.style.display = "inline-block";
  viewTabs.style.display = "flex";
}

async function logout() {
  selectedPhone = null;
  if (intervalo) {
    clearInterval(intervalo);
    intervalo = null;
  }
  await window.ossoAuth.signOut();
}

function escaparHTML(valor) {

  return String(valor || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatarData(data) {

  if (!data) return "";

  try {

    return new Date(data)
      .toLocaleString("pt-BR");

  } catch {

    return "";
  }
}

function atualizarMetricas(leads) {

  document.getElementById("mTotal").textContent =
    leads.length;

  document.getElementById("mHumano").textContent =
    leads.filter(
      l => l.conversation_owner === "HUMAN_PENDING" || l.conversation_owner === "HUMAN" || l.stage === "humano"
    ).length;

  document.getElementById("mQuente").textContent =
    leads.filter(
      l => l.stage === "quente"
    ).length;

  document.getElementById("mAgenda").textContent =
    leads.filter(
      l => l.stage === "agendamento"
    ).length;
}

function filtrarLeads() {

  const termo =
    busca.value.toLowerCase().trim();

  const stage =
    filtroStage.value;

  return leadsCache.filter(lead => {

    const texto =
      `${lead.phone || ""} ${lead.name || ""} ${lead.last_message || ""}`
      .toLowerCase();

    const matchBusca =
      !termo || texto.includes(termo);

    const matchStage =
      !stage || lead.stage === stage;

    return matchBusca && matchStage;
  });
}

function renderLeads() {

  const leads =
    filtrarLeads();

  leadsBox.innerHTML = "";

  leads.forEach(lead => {

    const ativo =
      selectedPhone === lead.phone
        ? "active"
        : "";

    const stage =
      lead.stage || "novo";
    const ownership = ownershipPresentation(lead);

    leadsBox.innerHTML += `
      <div
        class="lead-card ${escaparHTML(stage)} ${ativo}"
        onclick="selecionarLead('${escaparHTML(lead.phone)}')"
      >

        <div class="lead-phone">
          📱 ${escaparHTML(lead.phone)}
        </div>

        <div class="lead-name">
          👤 ${escaparHTML(lead.name || "Sem nome")}
        </div>

        <div class="lead-stage ${escaparHTML(stage)}">
          🎯 ${escaparHTML(stage)}
        </div>

        <div class="lead-ownership ${escaparHTML(ownership.css)}">
          ${escaparHTML(ownership.label)}
        </div>

        <div class="lead-message">
          💬 ${escaparHTML(lead.last_message || "")}
        </div>

      </div>
    `;
  });
}

async function carregarLeads() {

  const res = await window.ossoAuth.authorizedFetch(
    API + "?debug=leads"
  );

  const data =
    await res.json();

  if (!res.ok || !data.ok) {

    statusBox.innerHTML = "🔒 Sessão inválida";

    return;
  }

  mostrarApp();

  leadsCache =
    data.data || [];

  atualizarMetricas(leadsCache);

  renderLeads();

  statusBox.innerHTML =
    "✅ Dashboard conectado e protegido";

  if (selectedPhone) {

    const leadAtual =
      leadsCache.find(
        l => l.phone === selectedPhone
      );

    if (leadAtual) {
      atualizarHeaderLead(leadAtual);
    }
  }
}

function atualizarHeaderLead(lead) {

  const ownership = ownershipPresentation(lead);

  chatTitle.innerHTML =
    `${escaparHTML(lead.name || "Sem nome")} — ${escaparHTML(lead.phone)}`;

  chatSubtitle.innerHTML =
    `Stage comercial: ${escaparHTML(lead.stage || "novo")} • Ownership: ${escaparHTML(ownership.label)} • Última mensagem: ${escaparHTML(lead.last_message || "")}`;

  manualNote.style.display =
    lead.conversation_owner === "HUMAN" || lead.stage === "humano"
      ? "block"
      : "none";
}

async function selecionarLead(phone) {

  selectedPhone = phone;

  lastMessageCount = 0;

  const lead =
    leadsCache.find(
      l => l.phone === phone
    );

  if (lead) {
    atualizarHeaderLead(lead);
  }

  renderLeads();

  app.classList.add("chat-open");

  await carregarConversa(phone, true);
}

function voltarParaListaMobile() {
  app.classList.remove("chat-open");
}

async function carregarConversa(phone, forceScroll = false) {

  const url =
    API
    + "?debug=messages-by-phone"
    + "&phone=" + encodeURIComponent(phone);

  const res =
    await window.ossoAuth.authorizedFetch(url);

  const data =
    await res.json();

  if (!res.ok || !data.ok) {

    chatMessages.innerHTML =
      `<div class="erro">Erro ao carregar conversa.</div>`;

    return;
  }

  const mensagens =
    data.data || [];

  if (!mensagens.length) {

    chatMessages.innerHTML =
      `<div class="empty">Sem mensagens para este lead.</div>`;

    lastMessageCount = 0;

    return;
  }

  const deveScrollar =
    forceScroll ||
    mensagens.length !== lastMessageCount;

  lastMessageCount =
    mensagens.length;

  chatMessages.innerHTML = "";

  mensagens.forEach(msg => {

    const roleClass =
      msg.role === "user"
        ? "user"
        : "assistant";

    const roleLabel =
      msg.role === "user"
        ? "Cliente"
        : "Agente";

    let conteudoHTML = escaparHTML(msg.content);

    if (msg.media_type === "image") {
      conteudoHTML = `<img class="chat-image" src="${escaparHTML(msg.media_url)}" alt="Imagem enviada na conversa">`;
    } else if (msg.media_type === "audio") {
      conteudoHTML = `🎤 Áudio: ${escaparHTML(msg.content)}`;
    }

    chatMessages.innerHTML += `
      <div class="bubble ${roleClass}">

        <div class="bubble-meta">
          ${escaparHTML(roleLabel)}
          •
          ${escaparHTML(formatarData(msg.created_at))}
        </div>

        ${conteudoHTML}

      </div>
    `;
  });

  if (deveScrollar) {

    setTimeout(() => {

      chatMessages.scrollTop =
        chatMessages.scrollHeight;

    }, 50);
  }
}

async function enviarMensagemManual() {

  if (!selectedPhone) {

    alert("Selecione um lead primeiro.");

    return;
  }

  const mensagem =
    msgInput.value.trim();

  if (!mensagem) {

    alert("Digite uma mensagem.");

    return;
  }

  btnSend.disabled = true;

  btnSend.textContent =
    "Enviando...";

  try {

    const res = await window.ossoAuth.authorizedFetch(
      API + "?debug=send-message",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          phone: selectedPhone,
          message: mensagem
        })
      }
    );

    const data =
      await res.json();

    if (!res.ok || !data.ok) {

      alert("Erro ao enviar mensagem.");

      console.error(data);

      return;
    }

    msgInput.value = "";

    await carregarLeads();

    await carregarConversa(
      selectedPhone,
      true
    );

  } catch (err) {

    console.error(err);

    alert("Erro ao enviar mensagem.");

  } finally {

    btnSend.disabled = false;

    btnSend.textContent =
      "📤 Enviar mensagem";
  }
}

async function ativarHumano() {

  if (!selectedPhone) {

    alert("Selecione um lead primeiro.");

    return;
  }

  btnHuman.disabled = true;

  btnHuman.textContent =
    "Assumindo...";

  try {

    const res = await window.ossoAuth.authorizedFetch(
      API + "?debug=takeover",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          phone: selectedPhone
        })
      }
    );

    const data =
      await res.json();

    if (!res.ok || !data.ok) {

      alert("Erro ao assumir atendimento.");

      console.error(data);

      return;
    }

    await carregarLeads();

    await carregarConversa(
      selectedPhone,
      true
    );

  } catch (err) {

    console.error(err);

    alert("Erro ao assumir atendimento.");

  } finally {

    btnHuman.disabled = false;

    btnHuman.textContent =
      "🔴 Takeover";
  }
}

async function voltarIA() {

  if (!selectedPhone) {

    alert("Selecione um lead primeiro.");

    return;
  }

  const confirmar =
    confirm(
      "Tem certeza que deseja liberar a IA novamente para este lead?"
    );

  if (!confirmar) return;

  btnAI.disabled = true;

  btnAI.textContent =
    "Liberando...";

  try {

    const res = await window.ossoAuth.authorizedFetch(
      API + "?debug=release-ai",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          phone: selectedPhone
        })
      }
    );

    const data =
      await res.json();

    if (!res.ok || !data.ok) {

      alert("Erro ao liberar IA.");

      console.error(data);

      return;
    }

    await carregarLeads();

    await carregarConversa(
      selectedPhone,
      true
    );

  } catch (err) {

    console.error(err);

    alert("Erro ao liberar IA.");

  } finally {

    btnAI.disabled = false;

    btnAI.textContent =
      "🤖 Voltar IA";
  }
}

msgInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
      &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviarMensagemManual();
    }
  }
);

busca.addEventListener(
  "input",
  renderLeads
);

filtroStage.addEventListener(
  "change",
  renderLeads
);

function iniciarDashboard() {
  carregarLeads();

  if (intervalo) {
    clearInterval(intervalo);
  }

  intervalo = setInterval(() => {
    carregarLeads();

    if (selectedPhone) {
      carregarConversa(selectedPhone);
    }

  }, 5000);
}

function ownershipPresentation(lead) {
  if (lead.conversation_owner === "UNKNOWN") return { css: "ai-hold", label: "Estado indisponível" };
  if (lead.conversation_owner === "HUMAN_PENDING") return { css: "ai-hold", label: "Humano — aguardando Coringa" };
  if (lead.conversation_owner === "HUMAN" || lead.stage === "humano") return { css: "human", label: "Atendimento humano" };
  return { css: "ai", label: "IA ativa" };
}

function alternarView(view) {
  document.querySelectorAll(".view-tab").forEach(botao => {
    botao.classList.toggle("active", botao.dataset.view === view);
  });

  if (view === "relatorios") {
    app.style.display = "none";
    reportsView.classList.add("open");

    carregarRelatorios();

    if (reportsIntervalo) clearInterval(reportsIntervalo);
    reportsIntervalo = setInterval(carregarRelatorios, 30000);
  } else {
    reportsView.classList.remove("open");
    app.style.display = "grid";

    if (reportsIntervalo) {
      clearInterval(reportsIntervalo);
      reportsIntervalo = null;
    }
  }
}

const STAGE_LABELS = {
  humano: "Humano",
  quente: "Quente",
  agendamento: "Agendamento",
  orcamento: "Orçamento",
  novo: "Novo",
  captando_nome: "Captando nome",
  encerrado: "Encerrado",
  followup_1: "Followup 1",
  followup_2: "Followup 2",
  curioso: "Curioso"
};

function renderGraficoSerie(serie) {
  const largura = 760;
  const altura = 160;
  const margemBaixo = 20;
  const max = Math.max(1, ...serie.map(d => d.total));
  const larguraBarra = largura / serie.length;

  const barras = serie.map((d, i) => {
    const alturaBarra = Math.round((d.total / max) * (altura - margemBaixo - 10));
    const x = i * larguraBarra;
    const y = altura - margemBaixo - alturaBarra;
    const destaque = i === serie.length - 1;
    const cor = destaque ? "#00ff88" : "#0a5c3a";
    return (
      '<rect x="' + (x + 1) + '" y="' + y + '" width="' + Math.max(larguraBarra - 2, 1) +
      '" height="' + Math.max(alturaBarra, 1) + '" rx="2" fill="' + cor + '">' +
      '<title>' + escaparHTML(d.data) + ": " + d.total + '</title></rect>'
    );
  }).join("");

  const labelInicio = serie[0] ? serie[0].data.slice(5).replace("-", "/") : "";
  const labelFim = serie[serie.length - 1] ? serie[serie.length - 1].data.slice(5).replace("-", "/") : "";

  return (
    '<svg viewBox="0 0 ' + largura + ' ' + altura + '" width="100%" height="160" preserveAspectRatio="none">' +
    '<line x1="0" y1="' + (altura - margemBaixo) + '" x2="' + largura + '" y2="' + (altura - margemBaixo) +
    '" stroke="#2a2a2a" stroke-width="1"></line>' +
    barras +
    '</svg>' +
    '<div style="display:flex;justify-content:space-between;color:#777;font-size:11px;margin-top:6px;">' +
    '<span>' + escaparHTML(labelInicio) + '</span>' +
    '<span>' + escaparHTML(labelFim) + '</span>' +
    '</div>'
  );
}

async function carregarRelatorios() {
  reportsContent.innerHTML = '<div class="reports-empty">Carregando relatórios...</div>';

  const res = await window.ossoAuth.authorizedFetch(
    API + "?debug=stats&dias=" + relatoriosPeriodoAtual
  );

  const data =
    await res.json();

  if (!res.ok || !data.ok) {
    reportsContent.innerHTML = '<div class="reports-empty">Não foi possível carregar os relatórios.</div>';
    return;
  }

  const s = data.data;
  relatoriosUltimoResultado = s;

  const totalStage =
    Object.values(s.porStage).reduce((a, b) => a + b, 0) || 1;

  const stageRows = Object.entries(s.porStage)
    .filter(([, qtd]) => qtd > 0)
    .sort((a, b) => b[1] - a[1])
    .map(([stage, qtd]) => (
      '<div class="stage-row">' +
      '<span>' + escaparHTML(STAGE_LABELS[stage] || stage) + '</span>' +
      '<div class="stage-track"><div class="stage-fill" style="width:' +
      Math.round((qtd / totalStage) * 100) + '%"></div></div>' +
      '<span style="text-align:right;">' + qtd + '</span>' +
      '</div>'
    )).join("") || '<div class="reports-empty">Sem leads no período.</div>';

  const tempoResposta =
    s.tempoRespostaMedioMin != null ? s.tempoRespostaMedioMin + " min" : "—";

  reportsContent.innerHTML =
    '<div class="reports-grid">' +
    '<div class="report-card"><strong>' + s.totalLeads + '</strong><span>Total de leads (geral)</span></div>' +
    '<div class="report-card"><strong>' + s.leadsHoje + '</strong><span>Novos hoje</span></div>' +
    '<div class="report-card"><strong>' + tempoResposta + '</strong><span>Tempo médio de resposta (IA)</span></div>' +
    '<div class="report-card"><strong>' + (s.porStage.humano || 0) + '</strong><span>Em atendimento humano</span></div>' +
    '</div>' +
    '<div class="report-panel">' +
    '<h3>Leads novos — últimos ' + s.periodoDias + ' dias</h3>' +
    renderGraficoSerie(s.serieDiaria) +
    '</div>' +
    '<div class="reports-columns">' +
    '<div class="report-panel">' +
    '<h3>Funil de estágios (situação atual)</h3>' +
    renderFunil(s.funil, s.reengajamento) +
    '</div>' +
    '<div class="report-panel">' +
    '<h3>IA vs atendimento humano</h3>' +
    renderIaVsHumano(s.iaVsHumano) +
    '</div>' +
    '</div>' +
    '<div class="report-panel">' +
    '<h3>Leads mais quentes agora</h3>' +
    renderRankingQuentes(s.rankingQuentes) +
    '</div>' +
    '<div class="report-panel">' +
    '<h3>Leads por estágio (no período)</h3>' +
    stageRows +
    '</div>';
}

function renderFunil(funil, reengajamento) {
  if (!funil || !funil.length) {
    return '<div class="reports-empty">Sem leads no período.</div>';
  }

  const max = Math.max(1, ...funil.map(f => f.total));

  const linhas = funil.map(f => (
    '<div class="funnel-row">' +
    '<span>' + escaparHTML(f.label) + '</span>' +
    '<div class="funnel-track"><div class="funnel-fill" style="width:' +
    Math.round((f.total / max) * 100) + '%"></div></div>' +
    '<span style="text-align:right;">' + f.total + '</span>' +
    '</div>'
  )).join("");

  const nota = reengajamento > 0
    ? '<div class="reengajamento-note">+ ' + reengajamento + ' lead(s) em followup de reengajamento (fora do funil principal)</div>'
    : "";

  return linhas + nota;
}

function renderRankingQuentes(ranking) {
  if (!ranking || !ranking.length) {
    return '<div class="reports-empty">Nenhum lead ativo no período.</div>';
  }

  return ranking.map(lead => {
    const nome = lead.name || lead.phone;
    const mensagem = lead.lastMessage || "Sem mensagem registrada";
    const telefoneAttr = escaparHTML(lead.phone || "");
    return (
      '<div class="hot-lead-card" onclick="abrirLeadDoRelatorio(\'' + telefoneAttr + '\')">' +
      '<div class="hot-lead-top">' +
      '<span class="hot-lead-name">' + escaparHTML(nome) + '</span>' +
      '<span class="lead-stage ' + escaparHTML(lead.stage || "") + '">' +
      escaparHTML(STAGE_LABELS[lead.stage] || lead.stage || "") + '</span>' +
      '</div>' +
      '<div class="hot-lead-message">' + escaparHTML(mensagem) + '</div>' +
      '</div>'
    );
  }).join("");
}

function renderIaVsHumano(iaVsHumano) {
  if (!iaVsHumano) {
    return '<div class="reports-empty">Sem dados no período.</div>';
  }

  const ia = iaVsHumano.ia || { total: 0, avancados: 0 };
  const humano = iaVsHumano.humano || { total: 0, avancados: 0 };
  const taxaIa = ia.total ? Math.round((ia.avancados / ia.total) * 100) : 0;
  const taxaHumano = humano.total ? Math.round((humano.avancados / humano.total) * 100) : 0;

  return (
    '<div class="owner-compare">' +
    '<div class="owner-card ia">' +
    '<strong>' + ia.total + '</strong>' +
    '<span>Com a IA agora</span>' +
    '<div class="owner-rate">' + taxaIa + '% avançados no funil</div>' +
    '</div>' +
    '<div class="owner-card humano">' +
    '<strong>' + humano.total + '</strong>' +
    '<span>Com atendimento humano</span>' +
    '<div class="owner-rate">' + taxaHumano + '% avançados no funil</div>' +
    '</div>' +
    '</div>'
  );
}

function mudarPeriodoRelatorio(dias) {
  relatoriosPeriodoAtual = dias;

  document.querySelectorAll(".period-tab").forEach(botao => {
    botao.classList.toggle("active", Number(botao.dataset.dias) === dias);
  });

  carregarRelatorios();
}

function abrirLeadDoRelatorio(phone) {
  alternarView("conversas");
  selecionarLead(phone);
}

function exportarLeadsCSV() {
  const leads = relatoriosUltimoResultado ? relatoriosUltimoResultado.leadsParaExport : null;

  if (!leads || !leads.length) {
    alert("Nenhum lead para exportar nesse período.");
    return;
  }

  const cabecalho = ["telefone", "nome", "estagio", "ultima_mensagem", "criado_em", "atualizado_em"];
  const linhas = leads.map(lead => [
    lead.phone, lead.name, lead.stage, lead.lastMessage, lead.createdAt, lead.updatedAt
  ].map(valor => '"' + String(valor || "").replace(/"/g, '""') + '"').join(","));

  const csv = [cabecalho.join(","), ...linhas].join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "leads_" + relatoriosPeriodoAtual + "dias_" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

window.ossoAuth.getSession().then(session => {
  if (!session) {
    location.replace("/login");
    return;
  }
  mostrarApp();
  iniciarDashboard();
});

</script>
